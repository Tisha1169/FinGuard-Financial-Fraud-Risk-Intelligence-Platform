[project]
name = "finguard"
version = "0.1.0"
description = "FinGuard - Financial Fraud & Risk Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "shap>=0.45",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "streamlit>=1.32",
    "plotly>=5.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
